name: Publish ROCK
on:
  push:
    branches:
      - 3-22.04
      - 5-24.04

jobs:

  build-rock:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v54

  trivy:
    needs: [build-rock]
    uses: ./.github/workflows/trivy.yaml
    with:
      submit_dependency_graph: true
    permissions:
      contents: write # dependency graph
      security-events: write

  release:
    name: Release rock
    needs: [build-rock]
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v54
    with:
      artifact-prefix: ${{ needs.build-rock.outputs.artifact-prefix }}
    permissions:
      packages: write # Needed to publish to GitHub Container Registry
      contents: write # Needed to create git tags
